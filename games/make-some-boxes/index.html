<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Connect the dots and claim the most squares." />
    <title>Make Some Boxes | Game Shelf</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="page">
      <a class="shelf-link" href="../../index.html"><span>←</span> BACK TO GAME SHELF</a>

      <header class="heading">
        <div class="eyebrow"><span class="status-dot"></span> GAME 01 / ARCADE</div>
        <h1>Make Some <em>Boxes</em></h1>
        <p class="intro">Connect the dots, close a square, and claim it for your color. The player with the most boxes wins.</p>
      </header>

      <section class="game-card" aria-label="Make Some Boxes board">
        <div class="card-top"><span class="board-label">DOTS &amp; BOXES</span><span class="turn-note">TWO PLAYER</span></div>
        <div class="board-shell">
          <div id="box"></div>
        </div>
        <div class="game-actions">
          <button id="btn1" onclick="selectwinner()">End Game <span>↗</span></button>
          <button id="btn2" onclick="window.location.reload()">New Game <span>↻</span></button>
        </div>
      </section>

      <footer id="description"><span id="developer">BUILT BY NANDISH BS / CS&amp;E</span><span>CONNECT. CLAIM. WIN.</span></footer>
    </main>
    <script src="script.js"></script>
  </body>
